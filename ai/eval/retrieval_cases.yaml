# 检索评测的补充查询（2026-10-11，第二阶段 C2）：只测检索，不跑 Agent、不调用模型。
#
# 检索评测集 = 这里的查询 + cases.yaml 里带 passages 的题（用题目原文当查询）。
# passages 是应命中的知识库小节（"<文档 title>#<小节标题>"），第一个最关键；Recall@k 看全部，MRR 看排名最前的那个命中。
# style 用来分组看各种检索方式的长处：
#   keyword     查询里有字段名、取值、报错原文等字面关键词，关键词检索应占优
#   paraphrase  口语化、换了说法，和原文几乎没有相同的词，向量检索应占优
#   plain       普通问法

- id: r-memory-unit
  style: keyword
  query: memory_mb 是什么单位？32768 是多少内存？
  passages: [主机内置字段#硬件配置字段和单位]

- id: r-backup-audit-field
  style: keyword
  query: custom_fields.备份 从 true 变成 false 是什么意思
  passages: [审计记录说明#配置变更的 changes, 自定义字段约定#备份]

- id: r-regex-operator
  style: keyword
  query: 动态分组的 $regex 条件写 ^web 为什么匹配不到
  passages: [动态分组#条件怎么组合]

