id: "email-validator"
name: "Email Address Validator"
version: "1.0.0"
description: "Validates email addresses using comprehensive rules"
author: "WEND CMDB Team"
homepage: "https://github.com/wend/cmdb-plugins/email-validator"
license: "MIT"
type: "field"
tags:
  - "validation"
  - "email"
  - "field"
keywords:
  - "email"
  - "validator"
  - "field"

dependencies:
  cmdb: ">=1.0.0"

config:
  schema:
    type: "object"
    properties:
      strict_mode:
        type: "boolean"
        default: false
        description: "Enable strict RFC 5322 validation"
      allow_disposable:
        type: "boolean"
        default: true
        description: "Allow disposable email addresses"
      custom_domains:
        type: "array"
        items:
          type: "string"
        description: "List of custom allowed domains"
      blocked_domains:
        type: "array"
        items:
          type: "string"
        description: "List of blocked domains"
  default:
    strict_mode: false
    allow_disposable: true
    custom_domains: []
    blocked_domains: []
  required:
    - "strict_mode"
    - "allow_disposable"
  properties:
    supported_types:
      - "email"
      - "string"

permissions:
  - "field:validate"
  - "field:format"

resources:
  memory: "64MB"
  cpu: "0.1"
  disk: "10MB"
  timeout: "30s"

hooks:
  - "validate_value"
  - "format_value"
  - "parse_value"
  - "get_default_value"
  - "get_field_schema"

events:
  - "field.validated"
  - "field.formatted"

binary: "email-validator"
entrypoint: "main.py"

created_at: "2024-01-01T00:00:00Z"
updated_at: "2024-01-01T00:00:00Z"