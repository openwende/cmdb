id: "slack-notifier"
name: "Slack Notification Plugin"
version: "1.0.0"
description: "Sends notifications to Slack channels via webhooks"
author: "WEND CMDB Team"
homepage: "https://github.com/wend/cmdb-plugins/slack-notifier"
license: "MIT"
type: "notifier"
tags:
  - "notification"
  - "slack"
  - "webhook"
keywords:
  - "slack"
  - "notification"
  - "webhook"
  - "chat"

dependencies:
  cmdb: ">=1.0.0"

config:
  schema:
    type: "object"
    properties:
      webhook_url:
        type: "string"
        description: "Slack webhook URL"
        format: "uri"
      channel:
        type: "string"
        description: "Default Slack channel"
        default: "#alerts"
      username:
        type: "string"
        description: "Bot username"
        default: "CMDB Bot"
      icon_emoji:
        type: "string"
        description: "Bot icon emoji"
        default: ":robot_face:"
      include_metadata:
        type: "boolean"
        description: "Include event metadata in notifications"
        default: true
      severity_colors:
        type: "object"
        description: "Color mapping for event severities"
        properties:
          info:
            type: "string"
            default: "#36a64f"
          warning:
            type: "string"
            default: "#ff9900"
          error:
            type: "string"
            default: "#ff0000"
          critical:
            type: "string"
            default: "#8b0000"
  default:
    webhook_url: ""
    channel: "#alerts"
    username: "CMDB Bot"
    icon_emoji: ":robot_face:"
    include_metadata: true
    severity_colors:
      info: "#36a64f"
      warning: "#ff9900"
      error: "#ff0000"
      critical: "#8b0000"
  required:
    - "webhook_url"

permissions:
  - "notification:send"
  - "network:http"

resources:
  memory: "64MB"
  cpu: "0.1"
  disk: "10MB"
  timeout: "30s"

hooks:
  - "notify"
  - "validate_config"
  - "test_connection"

events:
  - "notification.sent"
  - "notification.failed"

entrypoint: "main.py"

created_at: "2024-01-01T00:00:00Z"
updated_at: "2024-01-01T00:00:00Z"