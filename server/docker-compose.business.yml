version: '3.8'

networks:
  cmdb-business-network:
    name: cmdb-business-network
    driver: bridge

volumes:
  postgres_data:
    name: cmdb_postgres_data

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: cmdb-postgres
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: cmdb123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cmdb-business-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb -d cmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  # Business Topology Server (新架构)
  business-server:
    build:
      context: .
      dockerfile: Dockerfile.business
      args:
        GOPROXY: "https://goproxy.cn,direct"
    container_name: cmdb-business-server
    environment:
      GIN_MODE: release
    volumes:
      - ./deploy/configs/business-config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - cmdb-business-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
