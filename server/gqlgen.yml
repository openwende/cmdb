# GraphQL code generator configuration

# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - graph/*.graphql

# Where should the generated server code go?
exec:
  filename: graph/generated/generated.go
  package: generated

# Uncomment to enable federation
# federation:
#   filename: graph/generated/federation.go
#   package: generated

# Where should any generated models go?
model:
  filename: graph/model/models_gen.go
  package: model

# Where should the resolver implementations go?
resolver:
  layout: follow-schema
  dir: graph
  package: graph

# Optional: turn on use `gqlgen:"fieldName"` tags in your models
# struct_tag: json

# Optional: turn on to use []Thing instead of []*Thing
# omit_slice_element_pointers: false

# Optional: turn on to skip generation of ComplexityRoot struct content and Complexity function
# omit_complexity: false

# Optional: turn on to not generate descriptions from comments in the GraphQL schema
# omit_descriptions: false

# Optional: turn on to exclude the gqlgen version in the generated file notice
# omit_gqlgen_file_notice: false

# Optional: turn on to exclude the gqlgen version in the generated file notice
# omit_gqlgen_version_comment: false

# gqlgen will search for any type names in the schema in these go packages
# if they match it will use them, otherwise it will generate them.
autobind:
  - "github.com/wend/cmdb-backend/pkg/types"
  - "github.com/wend/cmdb-backend/graph/model"

# This section declares type mapping between the GraphQL and go type systems
#
# The first line in each type will be used as defaults for resolver arguments and
# modelgen, the others will be allowed when binding to fields. Configure them to
# your liking
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  UUID:
    model:
      - github.com/google/uuid.UUID
    fields:
      marshal:
        - github.com/wend/cmdb-backend/graph/model.MarshalUUID
      unmarshal:
        - github.com/wend/cmdb-backend/graph/model.UnmarshalUUID
  Time:
    model:
      - time.Time
    fields:
      marshal:
        - github.com/wend/cmdb-backend/graph/model.MarshalTime
      unmarshal:
        - github.com/wend/cmdb-backend/graph/model.UnmarshalTime
  JSON:
    model:
      - github.com/wend/cmdb-backend/pkg/types.JSON
    fields:
      marshal:
        - github.com/wend/cmdb-backend/graph/model.MarshalJSON
      unmarshal:
        - github.com/wend/cmdb-backend/graph/model.UnmarshalJSON
  # Map GraphQL types to existing types
  Model:
    model: github.com/wend/cmdb-backend/pkg/types.Model
  Field:
    model: github.com/wend/cmdb-backend/pkg/types.Field
  Instance:
    model: github.com/wend/cmdb-backend/pkg/types.Instance
  User:
    model: github.com/wend/cmdb-backend/pkg/types.User
  Role:
    model: github.com/wend/cmdb-backend/pkg/types.Role
  Permission:
    model: github.com/wend/cmdb-backend/pkg/types.Permission
  AuditLog:
    model: github.com/wend/cmdb-backend/pkg/types.AuditLog
  BusinessTree:
    model: github.com/wend/cmdb-backend/pkg/types.BusinessTree
  BusinessNode:
    model: github.com/wend/cmdb-backend/pkg/types.BusinessNode