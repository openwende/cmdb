services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cmdb-postgres
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: cmdb123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb -d cmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cmdb-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: cmdb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - cmdb-network
    command: redis-server --appendonly yes --requirepass redis123

  # CMDB Backend Service (Simplified)
  cmdb-backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: cmdb-backend
    environment:
      # Server Configuration
      GIN_MODE: release
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cmdb-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cmdb-network:
    driver: bridge