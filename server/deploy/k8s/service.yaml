apiVersion: v1
kind: Service
metadata:
  name: cmdb-backend
  namespace: cmdb
  labels:
    app: cmdb-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: cmdb-backend