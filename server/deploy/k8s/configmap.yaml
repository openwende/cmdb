apiVersion: v1
kind: ConfigMap
metadata:
  name: cmdb-config
  namespace: cmdb
data:
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_MODE: "release"
  
  # Database Configuration
  DATABASE_HOST: "cmdb-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "cmdb"
  DATABASE_USER: "cmdb"
  DATABASE_SSLMODE: "disable"
  DATABASE_MAX_OPEN_CONNS: "25"
  DATABASE_MAX_IDLE_CONNS: "5"
  
  # Redis Configuration
  REDIS_HOST: "cmdb-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # JWT Configuration
  JWT_EXPIRES_IN: "24h"
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "*"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "*"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Features Configuration
  ENABLE_METRICS: "true"
  ENABLE_PROFILING: "false"
  ENABLE_SWAGGER: "true"
  PLUGINS_ENABLED: "true"
  EVENTS_ENABLED: "true"
  WEBSOCKET_ENABLED: "true"
  
  # Storage Configuration
  DATA_PATH: "/app/data"
  UPLOAD_MAX_SIZE: "10MB"
  PLUGINS_PATH: "/app/plugins"