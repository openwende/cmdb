apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: cmdb-backend

namespace: cmdb

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  - name: wend/cmdb-backend
    newTag: latest

configMapGenerator:
  - name: cmdb-config
    files:
      - configs/server.yaml
      - configs/database.yaml

secretGenerator:
  - name: cmdb-secrets
    literals:
      - database-password=cmdb123
      - redis-password=redis123
      - jwt-secret=your-super-secret-jwt-key-change-in-production

commonLabels:
  app.kubernetes.io/name: cmdb
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/component: backend

commonAnnotations:
  app.kubernetes.io/managed-by: kustomize