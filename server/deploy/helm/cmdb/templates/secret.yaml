apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cmdb.secretName" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
type: Opaque
data:
  # Database Password
  DATABASE_PASSWORD: {{ .Values.app.database.password | b64enc | quote }}
  
  # Redis Password
  REDIS_PASSWORD: {{ .Values.app.redis.password | b64enc | quote }}
  
  # JWT Secret
  JWT_SECRET: {{ .Values.app.jwt.secret | b64enc | quote }}