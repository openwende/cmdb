{{- if .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cmdb.metricsServiceName" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "cmdb.selectorLabels" . | nindent 4 }}
{{- end }}