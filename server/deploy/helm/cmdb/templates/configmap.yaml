apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmdb.configMapName" . }}
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
data:
  # Server Configuration
  SERVER_HOST: {{ .Values.app.server.host | quote }}
  SERVER_PORT: {{ .Values.app.server.port | quote }}
  SERVER_MODE: {{ .Values.app.server.mode | quote }}
  
  # Database Configuration
  DATABASE_HOST: {{ include "cmdb.postgresql.hostname" . | quote }}
  DATABASE_PORT: {{ .Values.app.database.port | quote }}
  DATABASE_NAME: {{ .Values.app.database.name | quote }}
  DATABASE_USER: {{ .Values.app.database.user | quote }}
  DATABASE_SSLMODE: {{ .Values.app.database.sslmode | quote }}
  DATABASE_MAX_OPEN_CONNS: {{ .Values.app.database.maxOpenConns | quote }}
  DATABASE_MAX_IDLE_CONNS: {{ .Values.app.database.maxIdleConns | quote }}
  
  # Redis Configuration
  REDIS_HOST: {{ include "cmdb.redis.hostname" . | quote }}
  REDIS_PORT: {{ .Values.app.redis.port | quote }}
  REDIS_DB: {{ .Values.app.redis.db | quote }}
  
  # JWT Configuration
  JWT_EXPIRES_IN: {{ .Values.app.jwt.expiresIn | quote }}
  
  # CORS Configuration
  CORS_ALLOWED_ORIGINS: {{ .Values.app.cors.allowedOrigins | quote }}
  CORS_ALLOWED_METHODS: {{ .Values.app.cors.allowedMethods | quote }}
  CORS_ALLOWED_HEADERS: {{ .Values.app.cors.allowedHeaders | quote }}
  
  # Logging Configuration
  LOG_LEVEL: {{ .Values.app.logging.level | quote }}
  LOG_FORMAT: {{ .Values.app.logging.format | quote }}
  
  # Features Configuration
  ENABLE_METRICS: {{ .Values.app.features.metrics | quote }}
  ENABLE_PROFILING: {{ .Values.app.features.profiling | quote }}
  ENABLE_SWAGGER: {{ .Values.app.features.swagger | quote }}
  PLUGINS_ENABLED: {{ .Values.app.features.plugins | quote }}
  EVENTS_ENABLED: {{ .Values.app.features.events | quote }}
  WEBSOCKET_ENABLED: {{ .Values.app.features.websocket | quote }}
  
  # Storage Configuration
  DATA_PATH: {{ .Values.app.storage.dataPath | quote }}
  UPLOAD_MAX_SIZE: {{ .Values.app.storage.uploadMaxSize | quote }}
  
  # Plugin System Configuration
  PLUGINS_PATH: "/app/plugins"