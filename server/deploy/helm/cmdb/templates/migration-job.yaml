{{- if .Values.jobs.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cmdb.fullname" . }}-migration
  labels:
    {{- include "cmdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.jobs.migration.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.jobs.migration.backoffLimit }}
  template:
    metadata:
      name: {{ include "cmdb.fullname" . }}-migration
      labels:
        {{- include "cmdb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: {{ .Values.jobs.migration.restartPolicy }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cmdb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ .Values.jobs.migration.image.repository }}:{{ .Values.jobs.migration.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/cmdb
            - migrate
            - up
          envFrom:
            - configMapRef:
                name: {{ include "cmdb.configMapName" . }}
            - secretRef:
                name: {{ include "cmdb.secretName" . }}
          resources:
            {{- toYaml .Values.jobs.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}