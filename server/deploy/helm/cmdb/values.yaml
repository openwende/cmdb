# Default values for WEND CMDB Backend
# This is a YAML-formatted file.

# Image configuration
image:
  repository: wend/cmdb-backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application configuration
app:
  # Server configuration
  server:
    host: "0.0.0.0"
    port: 8080
    mode: "release"
  
  # Database configuration
  database:
    host: "cmdb-postgresql"
    port: 5432
    name: "cmdb"
    user: "cmdb"
    password: "cmdb123"
    sslmode: "disable"
    maxOpenConns: 25
    maxIdleConns: 5
  
  # Redis configuration
  redis:
    host: "cmdb-redis-master"
    port: 6379
    password: "redis123"
    db: 0
  
  # JWT configuration
  jwt:
    secret: "your-super-secret-jwt-key-change-in-production"
    expiresIn: "24h"
  
  # CORS configuration
  cors:
    allowedOrigins: "*"
    allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
    allowedHeaders: "*"
  
  # Logging configuration
  logging:
    level: "info"
    format: "json"
  
  # Features
  features:
    metrics: true
    profiling: false
    swagger: true
    plugins: true
    events: true
    websocket: true
  
  # File storage
  storage:
    dataPath: "/app/data"
    uploadMaxSize: "10MB"

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cmdb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cmdb-tls
  #    hosts:
  #      - cmdb.example.com

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Replica count
replicaCount: 1

# Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Volume mounts
volumeMounts:
  - name: data
    mountPath: /app/data
  - name: logs
    mountPath: /app/logs
  - name: plugins
    mountPath: /app/plugins
  - name: tmp
    mountPath: /tmp

# Volumes
volumes:
  - name: data
    emptyDir: {}
  - name: logs
    emptyDir: {}
  - name: plugins
    emptyDir: {}
  - name: tmp
    emptyDir: {}

# Persistent Volume Claims
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# Environment variables
env: []
# - name: CUSTOM_VAR
#   value: "custom_value"

# Environment variables from secrets/configmaps
envFrom: []
# - secretRef:
#     name: cmdb-secrets
# - configMapRef:
#     name: cmdb-config

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# PostgreSQL dependency
postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    postgresPassword: "postgres123"
    username: "cmdb"
    password: "cmdb123"
    database: "cmdb"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Redis dependency
redis:
  enabled: true
  auth:
    enabled: true
    password: "redis123"
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# Monitoring configuration
monitoring:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: true
      namespace: ""
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
    rules:
      enabled: true
      namespace: ""
      labels: {}
  
  grafana:
    enabled: false
    dashboards:
      enabled: true
      namespace: ""
      labels: {}

# Network policies
networkPolicy:
  enabled: false
  ingress:
    enabled: true
    from: []
  egress:
    enabled: true
    to: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

# Configuration for external secrets
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: SecretStore
  refreshInterval: 1h
  secrets: []
  # - name: cmdb-secrets
  #   data:
  #   - secretKey: jwt-secret
  #     remoteRef:
  #       key: cmdb/jwt-secret

# Jobs
jobs:
  migration:
    enabled: true
    image:
      repository: wend/cmdb-backend
      tag: "latest"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    backoffLimit: 3
    restartPolicy: Never
    annotations: {}

# Service monitor for Prometheus
serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics

# Metrics service
metricsService:
  enabled: true
  port: 9090
  annotations: {}

# Pod monitor for Prometheus
podMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s