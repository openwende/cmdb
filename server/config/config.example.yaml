# Wend CMDB Configuration Example
# Copy this file to config.yaml and modify as needed

server:
  host: "0.0.0.0"
  port: 8080
  # debug, release, test. Release mode refuses the JWT secret below and does not
  # create demo accounts.
  mode: "debug"
  read_timeout: "10s"
  write_timeout: "10s"
  idle_timeout: "60s"
  
  cors:
    enabled: true
    allow_origins:
      - "*"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow_headers:
      - "*"
    allow_credentials: true
    max_age: 86400

database:
  host: "localhost"
  port: 5432
  user: "cmdb"
  password: "password"
  name: "cmdb"
  ssl_mode: "disable"
  timezone: "UTC"
  
  # Connection pool settings
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: "1h"
  conn_max_idle_time: "15m"
  
  # Migration settings
  migrations_path: "./migrations"

auth:
  jwt:
    # Placeholder for local development. In release mode, set AUTH_JWT_SECRET
    # to a random value, for example the output of `openssl rand -hex 32`.
    secret: "your-super-secret-jwt-key-at-least-32-characters-long"
    issuer: "wend-cmdb"
    access_token_expiry: "24h"
    refresh_token_expiry: "168h"  # 7 days
    refresh_token_enabled: true
  
  password:
    algorithm: "bcrypt"  # bcrypt, argon2id
    cost: 12
  
  session:
    timeout: "24h"
    max_sessions: 5

log:
  level: "info"        # debug, info, warn, error
  format: "json"       # json, text
  output: "stdout"     # stdout, stderr, file
  filename: ""         # required if output is file
  max_size: 100        # MB
  max_backups: 3
  max_age: 7           # days
  compress: true