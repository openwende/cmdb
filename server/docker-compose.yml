# Defined networks for internal container communication
name: cmdb-server

networks:
  cmdb-network:
    driver: bridge

# Persistent volumes
volumes:
  cmdb_postgres_data:
    name: cmdb_postgres_data

services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL 18 + pgvector)
  # Usage:
  #   - Dev: docker-compose up -d db (Starts just DB for local Go dev)
  #   - Full: docker-compose up -d (Starts DB + App)
  # pgvector image = official postgres:18 (Debian trixie) plus the vector
  # extension, used by the AI service's knowledge base (schema `ai` only).
  # The CMDB itself does not use vector. Upgrading from 18.0/18.1 requires
  # REINDEX of ltree indexes (PostgreSQL 18.2 release notes).
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: cmdb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb
      POSTGRES_PASSWORD: password # Local development only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # Local dev tools (pgAdmin, DBeaver)
    volumes:
      - cmdb_postgres_data:/var/lib/postgresql
      # - ./migrations:/docker-entrypoint-initdb.d # Optional: Auto-init with SQL
    networks:
      - cmdb-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cmdb -d cmdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Database Migration Service (Runs once before app starts)
  # ---------------------------------------------------------------------------
  db-migrate:
    image: migrate/migrate:v4.17.0
    container_name: cmdb-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: >
      -path=/migrations
      -database postgres://cmdb:password@db:5432/cmdb?sslmode=disable
      up
    networks:
      - cmdb-network
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Application Service (Business Server)
  # Usage:
  #   - Full: docker-compose up -d (Automatically builds and runs app)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.business
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: cmdb-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      # Local development only: debug mode allows the built-in JWT secret and
      # creates the demo accounts. See the quick start in the root README for a release-mode setup.
      SERVER_MODE: debug
      DATABASE_HOST: db # Connects to 'db' service alias
      DATABASE_PASSWORD: password
      ENABLE_COMPAT_AUTOMIGRATE: "true"
    ports:
      - "8080:8080"
    volumes:
      # Mount config for runtime updates (Optional)
      # - ./config/config.yaml:/app/config/config.yaml:ro
      - ./logs:/app/logs
    networks:
      - cmdb-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M
